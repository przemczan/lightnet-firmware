; PlatformIO Project Configuration File
;
; Layered layout:
;   [platformio] + platformio_local.ini  — per-machine overrides (ports)
;   [lightnet*]                          — shared build flags and lib dirs
;   [controller_*] / [panel_*]           — target-family bases (not built)
;   [env:*]                              — concrete build/upload targets
;
; LittleFS download: PlatformIO → Custom → Download Filesystem, or:
;   pio run -e controller_esp32 -t downloadfs

[platformio]
extra_configs =
    platformio_local.ini

; --- Project-wide ---

[lightnet]
lib_extra_dirs =
    lib/Lightnet
    lib/Lightnet/Core
build_flags =
    -Wno-reorder -Wno-switch

[lightnet_controller]
build_flags =
    -include src/controller.config.hpp
    -D LIGHTNET_TARGET_CONTROLLER

[lightnet_panel]
build_flags =
    -include src/panel.config.hpp

[controller_fs]
extra_scripts =
    pre:tools/fw_version.py
    tools/download_fs.py
custom_unpack_dir = data

[controller_fs_esp32]
platform_packages =
    tool-mklittlefs@tasmota/tool-mklittlefs@^4.0.0

[controller_sim]
sim_serial_baud = 230400

; --- Controller bases ---

[controller_common]
framework = arduino
board_build.filesystem = littlefs
extra_scripts = ${controller_fs.extra_scripts}
custom_unpack_dir = ${controller_fs.custom_unpack_dir}
lib_ldf_mode = chain+
lib_extra_dirs = ${lightnet.lib_extra_dirs}
build_flags = ${lightnet.build_flags} ${lightnet_controller.build_flags}
lib_deps =
    ESPAsyncWifiManager
    ESP32Async/ESPAsyncWebServer@3.11.1
    FastLED@3.3.2
lib_ignore = AsyncTCP_RP2040W
monitor_speed = 57600

[controller_esp32_common]
extends = controller_common
platform = espressif32
platform_packages = ${controller_fs_esp32.platform_packages}
build_flags =
    ${lightnet.build_flags}
    ${lightnet_controller.build_flags}
    -D LIGHTNET_MQTT=1
lib_deps =
    ESPAsyncWifiManager
    ESP32Async/ESPAsyncWebServer@3.11.1
    ESP32Async/AsyncTCP@3.4.10
    FastLED@3.3.2
    marvinroger/AsyncMqttClient@^0.9.0
lib_ignore = AsyncTCP_RP2040W
monitor_speed = 57600

; --- Panel bases ---

[panel_fuses_328]
board_fuses.lfuse = 0xF7
board_fuses.hfuse = 0xD8
board_fuses.efuse = 0xFC

; No framework = arduino: MiniCore permanently claims both AVR328PB USART vectors regardless of
; whether Serial is used, which blocks the real USART RX ISR this design needs (see
; lib/Lightnet/Panel/EdgeUartTransport.hpp for the empirical finding, hardware redesign plan §10).
; UNVALIDATED HARDWARE: builds clean, but the relay transport it and the controller both speak
; has not been bench-tested on real silicon yet — see the hardware redesign plan.
[panel_atmega328_common]
extends = lightnet
platform = atmelavr
build_flags +=
    ${lightnet_panel.build_flags}
lib_ldf_mode = chain+
lib_extra_dirs = ${lightnet.lib_extra_dirs}
extra_scripts = post:tools/generate_bin.py
monitor_speed = 57600

; --- Native tests (pio test -e native) ---

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=gnu++14
    ${lightnet.build_flags}
    -I lib/Lightnet

; --- Controller targets ---
;
; ESP8266 controller targets are retired: it doesn't meet the relay design's requirements (no
; spare hardware UART for the trunk, and RAM was already tight). ESP32-class boards only.

[env:controller_esp32]
extends = controller_esp32_common
board = esp32dev
upload_speed = 460800

[env:controller_esp32_sim]
extends = env:controller_esp32
monitor_speed = ${controller_sim.sim_serial_baud}
build_flags = ${env:controller_esp32.build_flags}
    -D SIM_MODE
    -D SIM_SERIAL_BAUD=${controller_sim.sim_serial_baud}
    -D SIM_PANELS_COUNT=20

[env:controller_s2_mini]
extends = controller_esp32_common
board = lolin_s2_mini
upload_speed = 460800

[env:controller_s2_mini_sim]
extends = env:controller_s2_mini
monitor_speed = ${controller_sim.sim_serial_baud}
build_flags = ${env:controller_s2_mini.build_flags}
    -D SIM_MODE
    -D SIM_SERIAL_BAUD=${controller_sim.sim_serial_baud}
    -D SIM_PANELS_COUNT=20

; --- Panel targets ---

[env:panel_atmega328p]
extends = panel_atmega328_common, panel_fuses_328
board = ATmega328P
upload_protocol = usbasp
; -D: skip chip-erase so an existing bootloader (burned separately, see the bootloader envs
; below) is preserved.
upload_flags = -D

[env:panel_atmega328pb]
extends = env:panel_atmega328p
board = ATmega328PB

[env:panel_atmega328_via_controller]
extends = panel_atmega328_common
board = ATmega328P
upload_protocol = custom
upload_command = $PYTHONEXE "${PROJECT_DIR}/tools/flash_panels_serial.py" $UPLOAD_PORT "${BUILD_DIR}/firmware.bin"

; --- Bootloader (one-time burn) ---
;
; The relay's own OTA bootloader — speaks the relay's UART/PacketMeta framing, for panels flashed
; over the point-to-point relay trunk. Lives at lib/Lightnet/Panel/bootloader/RelayBootloader.cpp,
; guarded on LIGHTNET_BUILD_RELAY_BOOTLOADER so it compiles to an empty translation unit in every
; other environment (see that file's guard comment — it would otherwise be swept into the normal
; panel app build too, since it lives inside the Panel/ library folder).
; UNVALIDATED HARDWARE, and no bench spike has run (see docs/ota.md) — this gets the panel-side
; image building within the 4 KB boot section and a controller-side driver
; (Controller/OTA/RelayBootloaderClient), but nothing here has been exercised on real silicon.
[env:atmega328p_bootloader]
extends = panel_fuses_328
platform = atmelavr
board = atmega328p
upload_protocol = usbasp
build_src_filter =
    -<*>
    +<../lib/Lightnet/Panel/bootloader/RelayBootloader.cpp>
    +<../lib/Lightnet/Core/Relay/PacketFramer.cpp>
    +<../lib/Lightnet/Core/Common/ProtocolMeta.cpp>
    +<../lib/Lightnet/Utils/Crc.cpp>
extra_scripts = post:tools/generate_bin.py
build_flags =
    -D LIGHTNET_BUILD_RELAY_BOOTLOADER
    -DBOOTLOADER_START=0x7000
    -Os
    -Wall
    -nostartfiles
    -ffunction-sections
    -fdata-sections
    -Wl,--relax
    -Wl,--gc-sections
    -Wl,--section-start=.text=0x7000

[env:atmega328pb_bootloader]
extends = env:atmega328p_bootloader
board = atmega328pb
