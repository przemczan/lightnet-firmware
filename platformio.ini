; PlatformIO Project Configuration File
;
; Layered layout:
;   [platformio] + platformio_local.ini  — per-machine overrides (ports)
;   [lightnet*]                          — shared build flags and lib dirs
;   [controller_*] / [panel_*]           — target-family bases (not built)
;   [env:*]                              — concrete build/upload targets
;
; LittleFS download: PlatformIO → Custom → Download Filesystem, or:
;   pio run -e controller_esp32 -t downloadfs

[platformio]
extra_configs =
    platformio_local.ini

; --- Project-wide ---

[lightnet]
lib_extra_dirs =
    lib/Lightnet
    lib/Lightnet/Core
build_flags =
    -Wno-reorder -Wno-switch

[lightnet_controller]
build_flags =
    -include src/controller.config.hpp
    -D LIGHTNET_TARGET_CONTROLLER

[lightnet_panel]
build_flags =
    -include src/panel.config.hpp

[controller_fs]
extra_scripts =
    pre:tools/fw_version.py
    tools/download_fs.py
custom_unpack_dir = data

[controller_fs_esp32]
platform_packages =
    tool-mklittlefs@tasmota/tool-mklittlefs@^4.0.0

[controller_sim]
sim_serial_baud = 230400

; --- Controller bases ---

[controller_common]
framework = arduino
board_build.filesystem = littlefs
extra_scripts = ${controller_fs.extra_scripts}
custom_unpack_dir = ${controller_fs.custom_unpack_dir}
lib_ldf_mode = chain+
lib_extra_dirs = ${lightnet.lib_extra_dirs}
build_flags = ${lightnet.build_flags} ${lightnet_controller.build_flags}
lib_deps =
    ESPAsyncWifiManager
    ESP32Async/ESPAsyncWebServer@3.11.1
lib_ignore = AsyncTCP_RP2040W
monitor_speed = 57600

[controller_esp32_common]
extends = controller_common
platform = espressif32
platform_packages = ${controller_fs_esp32.platform_packages}
build_flags =
    ${lightnet.build_flags}
    ${lightnet_controller.build_flags}
    -D LIGHTNET_MQTT=1
lib_deps =
    ESPAsyncWifiManager
    ESP32Async/ESPAsyncWebServer@3.11.1
    ESP32Async/AsyncTCP@3.4.10
    marvinroger/AsyncMqttClient@^0.9.0
lib_ignore = AsyncTCP_RP2040W
monitor_speed = 57600

; --- Panel bases ---

; lfuse=0xF7: CKSEL[3:0]=0111, SUT[1:0]=11. On the ATmega328P this selects the Full Swing Crystal
; Oscillator (rail-to-rail XTAL2 swing, more robust to board noise; valid 0.4-20MHz, so the 16MHz
; crystal is in range), slowest/safest start-up ramp. The ATmega328PB datasheet's Table 11-1
; (Device Clocking Options Select) has no Full Swing option at all -- Microchip dropped it from
; that variant -- CKSEL=0111 instead selects the Low Power Crystal Oscillator's 8-16MHz band on
; that chip, same start-up ramp, so this byte is shared as-is by both variants (see
; env:panel_atmega328pb / env:atmega328pb_bootloader for the efuse override the PB variant does
; need).
; efuse=0xFD: BODLEVEL[2:0]=101, 2.7V typical brown-out trigger (datasheet Table "BODLEVEL Fuse
; Coding"). This is 328P-only -- see env:panel_atmega328pb / env:atmega328pb_bootloader.
[panel_fuses_328]
board_fuses.lfuse = 0xF7
board_fuses.hfuse = 0xD8
board_fuses.efuse = 0xFD

; No framework = arduino: MiniCore permanently claims both AVR328PB USART vectors regardless of
; whether Serial is used, which blocks the real USART RX ISR this design needs (see
; lib/Lightnet/Panel/EdgeUartTransport.hpp for the empirical finding, hardware redesign plan §10).
[panel_atmega328_common]
extends = lightnet
platform = atmelavr
build_flags =
    ${lightnet.build_flags}
    ${lightnet_panel.build_flags}
lib_ldf_mode = chain+
lib_extra_dirs = ${lightnet.lib_extra_dirs}
extra_scripts = post:tools/generate_bin.py
monitor_speed = 57600

; --- Native tests (pio test -e native) ---

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=gnu++14
    ${lightnet.build_flags}
    -I lib/Lightnet

; --- Controller targets ---
;
; ESP8266 controller targets are retired: it doesn't meet the relay design's requirements (no
; spare hardware UART for the trunk, and RAM was already tight). ESP32-class boards only.

[env:controller_esp32]
extends = controller_esp32_common
board = esp32dev
upload_speed = 460800

[env:controller_esp32_sim]
extends = env:controller_esp32
monitor_speed = ${controller_sim.sim_serial_baud}
build_flags = ${env:controller_esp32.build_flags}
    -D SIM_MODE
    -D SIM_SERIAL_BAUD=${controller_sim.sim_serial_baud}
    -D SIM_PANELS_COUNT=20

[env:controller_s2_mini]
extends = controller_esp32_common
board = lolin_s2_mini
upload_speed = 460800
; Serial is native USB CDC (TinyUSB USBCDC). Two line-state facts drive these settings:
; write() drops all output unless the host asserts DTR, so the monitor must keep DTR on;
; the reset-to-bootloader sequence starts from an RTS-asserted state, so keeping RTS off
; makes monitor attach/detach passive (uploads are unaffected -- esptool drives the lines
; itself).
monitor_dtr = 1
monitor_rts = 0
build_flags =
    ${controller_esp32_common.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:controller_s2_mini_sim]
extends = env:controller_s2_mini
monitor_speed = ${controller_sim.sim_serial_baud}
build_flags = ${env:controller_s2_mini.build_flags}
    -D SIM_MODE
    -D SIM_SERIAL_BAUD=${controller_sim.sim_serial_baud}
    -D SIM_PANELS_COUNT=20

[env:controller_esp32_c3]
extends = controller_esp32_common
; Unbranded ESP32-C3-MINI-1 clone board (silkscreen just says "ESP32-C3 module", no
; WEMOS/Lolin branding) -- bench-confirmed to use a physical USB-UART bridge chip on UART0,
; NOT the chip's internal USB-Serial-JTAG controller: the ROM boot banner ("ESP-ROM:
; esp32c3-api1-20210207") reads clean at 115200 over the same USB port used to flash, and the
; ROM always prints that banner via UART0 -- if this were native USB-JTAG-CDC, UART0 would be
; unmonitored and nothing would print there at all before the app's own Serial.begin(). Do NOT
; set ARDUINO_USB_MODE/ARDUINO_USB_CDC_ON_BOOT here: those redirect Serial to the internal
; USB-JTAG pins, which this board's bridge chip can't see -- board = esp32-c3-devkitm-1 is used
; below only for its plain-ESP32-C3 chip parameters (no board here bakes in a USB-CDC
; assumption); it does not claim this is Espressif's reference DevKitM-1 board, and the pin
; choices in src/controller/config.hpp are independently bench-verified against this specific
; clone's own header, not the DevKitM-1's fuller one.
board = esp32-c3-devkitm-1
upload_speed = 460800

[env:controller_esp32_c3_sim]
extends = env:controller_esp32_c3
monitor_speed = ${controller_sim.sim_serial_baud}
build_flags = ${env:controller_esp32_c3.build_flags}
    -D SIM_MODE
    -D SIM_SERIAL_BAUD=${controller_sim.sim_serial_baud}
    -D SIM_PANELS_COUNT=20

; --- Panel targets ---

[env:panel_atmega328p]
extends = panel_atmega328_common, panel_fuses_328
board = ATmega328P
upload_protocol = usbasp
; PlatformIO's atmelavr builder unconditionally appends its own -D to every avrdude invocation
; (platforms/atmelavr/builder/main.py's BeforeUpload, "disable erasing by default" -- not
; controllable from this file). -e forces an explicit chip erase as its own action before the
; write, which happens regardless of that trailing -D (which then just suppresses the
; now-redundant automatic pre-write erase) -- without it, ISP writes land on whatever was
; previously in flash, corrupting anything that doesn't happen to already match.
upload_flags =
;    -B 2
    ;-e

[env:panel_atmega328pb]
extends = env:panel_atmega328p
board = ATmega328PB
; efuse=0xF5, not the 328P's 0xFD: same BODLEVEL[2:0]=101 (2.7V), but bit 3 is unused-and-must-
; read-0 on this variant instead of the usual AVR unused-bits-read-1 convention -- avrdude accepts
; 0xFD today with a deprecation warning ("should be 0xf5") but will hard-error on it eventually.
board_fuses.efuse = 0xF5

[env:panel_atmega328_via_controller]
extends = panel_atmega328_common
board = ATmega328P
upload_protocol = custom
upload_command = $PYTHONEXE "${PROJECT_DIR}/tools/flash_panels_serial.py" $UPLOAD_PORT "${BUILD_DIR}/firmware.bin"

; --- Bootloader (one-time burn) ---
;
; The relay's own OTA bootloader — speaks the relay's UART/PacketMeta framing, for panels flashed
; over the point-to-point relay trunk. Lives at lib/Lightnet/Panel/bootloader/RelayBootloader.cpp,
; guarded on LIGHTNET_BUILD_RELAY_BOOTLOADER so it compiles to an empty translation unit in every
; other environment (see that file's guard comment — it would otherwise be swept into the normal
; panel app build too, since it lives inside the Panel/ library folder). Driven from the
; controller side by Controller/OTA/RelayBootloaderClient — see docs/ota.md.
[env:atmega328p_bootloader]
extends = panel_fuses_328
platform = atmelavr
board = atmega328p
upload_protocol = usbasp
build_src_filter =
    -<*>
    +<../lib/Lightnet/Panel/bootloader/RelayBootloader.cpp>
    +<../lib/Lightnet/Panel/DebugSerial.cpp>
    +<../lib/Lightnet/Core/Relay/PacketFramer.cpp>
    +<../lib/Lightnet/Core/Common/ProtocolMeta.cpp>
    +<../lib/Lightnet/Utils/Crc.cpp>
extra_scripts = post:tools/generate_bin.py
build_flags =
    ; Only for LIGHTNET_TRUNK_BAUD (BootloaderProtocol.hpp) — the bootloader uses no debug macros.
    -include src/panel.config.hpp
    -D LIGHTNET_BUILD_RELAY_BOOTLOADER
    -DBOOTLOADER_START=0x7000
    -Os
    -Wall
    -nostartfiles
    -ffunction-sections
    -fdata-sections
    -Wl,--relax
    -Wl,--gc-sections
    -Wl,--section-start=.text=0x7000
; See env:panel_atmega328p for why -e is needed (PlatformIO always appends its own -D).
upload_flags =
    -B 10
    -e

[env:atmega328pb_bootloader]
extends = env:atmega328p_bootloader
board = atmega328pb
; See env:panel_atmega328pb for why this differs from the 328P's 0xFD.
board_fuses.efuse = 0xF5

; Recovery/instrumentation tool: turns a spare ATmega328P into a clock donor for reviving a
; panel whose fuses expect an external clock it no longer gets. Uploads a minimal app that
; divides the donor's own 16MHz system clock by 16 via CLKPR before it reaches CKOUT/PB0, so the
; injected signal is a cleaner ~1MHz square wave -- easier to drive through a coupling cap and
; less likely to be fought by the dead panel's own oscillator amplifier bias than the raw 16MHz.
; See tools/recovery/ckout_divider.cpp.
[env:donor_ckout_slowclock]
platform = atmelavr
board = ATmega328P
upload_protocol = usbasp
; See env:panel_atmega328p for why -e is needed (PlatformIO always appends its own -D).
upload_flags =
    -B 10
    -e
build_src_filter =
    -<*>
    +<../tools/recovery/ckout_divider.cpp>
